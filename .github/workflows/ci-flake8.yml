name: release-gates

on: [pull_request]

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Show Python version
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run release gates
        env:
          DEBUG: "true"
          DATABASE_URL: sqlite:////tmp/isi-ci.sqlite3
        run: python scripts/run_release_gates.py --json-out "$RUNNER_TEMP/release-gates.json"

      - name: Print discovered test count
        if: always()
        run: |
          python - "$RUNNER_TEMP/release-gates.json" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          if not path.is_file():
              print("discovered_test_count=NOT_RUN")
              print("reason=release-gates.json was not written")
              sys.exit(1)
          data = json.loads(path.read_text())
          count = data.get("discovered_test_count")
          print(f"discovered_test_count={count}")
          if count is None:
              sys.exit(1)
          PY

      - name: Gather release evidence (no fabrication)
        if: always()
        run: |
          python scripts/gather_release_evidence.py \
            --gates "$RUNNER_TEMP/release-gates.json" \
            --out "$RUNNER_TEMP/gathered.json"
          python - "$RUNNER_TEMP/gathered.json" <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text())
          print("head=", data["source"]["head"])
          print("branch=", data["source"]["branch"])
          print("store_item_id=", data["store_item_id"])
          PY
