# Render Blueprint for the Investigating Search Interface.
# With this file in the repo root, Render's "New +" -> "Blueprint" flow
# creates the service automatically; every git push to main then deploys.
#
# Do not point this service at the release/season-2026 branch. The workshop
# backend goes live only after Rosie merges that branch to main. The database
# is NOT defined here: it lives on Neon (free tier, persistent). Paste the
# Neon connection string into the DATABASE_URL variable when Render prompts.

services:
  - type: web
    name: investigating-search-interface
    runtime: python
    plan: standard
    region: frankfurt  # closest Render region to the UK
    branch: main
    buildCommand: |
      python scripts/verify_release_lock.py
      python -m pip install --require-hashes -r requirements-release.lock
      python -c "import sys; print('python', sys.version)"
      python -m pip freeze --all | sort
      python django/manage.py collectstatic --noinput
      python django/manage.py download_model
    startCommand: bash render-start.sh
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false  # paste the Neon postgres:// URL in the Render dashboard
      - key: WEB_CONCURRENCY
        value: "1"   # single worker: fits the instance with the ONNX model
      - key: CLASSIFIER_ENABLED
        value: "true"
      - key: CLASSIFIER_THRESHOLD
        value: "0.35"
      - key: TRIGGER_FALLBACK_ENABLED
        value: "false"
      - key: RESEARCH_WRITES_ENABLED
        value: "false"
      - key: ADMIN_EMAIL
        value: ""    # set in dashboard if wanted
