<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header>
        <h1>Investigating Search Interface</h1>
        <p class="subtitle">SEASON 2026 workshop</p>
    </header>

    <main>
        <label class="row toggle-row">
            <span>Show prompts on Google searches</span>
            <input type="checkbox" id="enabled-toggle">
        </label>

        <section id="topics-section">
            <h2>Topic areas</h2>
            <p class="hint">Untick any areas you'd rather not see prompts for. This stays on your device and is sent only with a search.</p>
            <div id="topics-list" aria-live="polite">Topic list appears after your first search.</div>
        </section>
    </main>

    <footer>
        <a id="privacy-link" href="#" target="_blank" rel="noopener noreferrer">Privacy notice</a>
        <a id="project-link" href="#" target="_blank" rel="noopener noreferrer">About the project</a>
    </footer>

    <script src="config.js"></script>
    <script src="popup.js"></script>
</body>
</html>
